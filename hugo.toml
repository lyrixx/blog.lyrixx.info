baseURL = "https://blog.lyrixx.info/"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
# The scripts drawing the figures of an article live next to them, but are not published.
ignoreFiles = ['\.py$']
locale = "en"
title = "Grégoire Pineau"

[markup.goldmark.extensions.extras.mark]
enable = true

[markup.goldmark.renderHooks.image]
useEmbedded = "fallback"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

[outputs]
home = ["html", "rss"]
section = ["html"]

[params]
bluesky = "https://bsky.app/profile/lyrixx.bsky.social"
description = "A geek’s herbarium."
github = "https://github.com/lyrixx"
x = "https://x.com/lyrixx"
